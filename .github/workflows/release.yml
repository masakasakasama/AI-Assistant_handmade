name: Release APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version without v prefix; defaults to app versionName
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*System\.getenv\("VERSION_NAME"\)\s*\?:\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No release needed
        if: steps.release_check.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "v$VERSION already exists; skipping"

      - uses: actions/setup-node@v4
        if: steps.release_check.outputs.exists != 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Build and verify Web for the same release
        if: steps.release_check.outputs.exists != 'true'
        run: |
          npm ci --ignore-scripts
          npm test --workspace ai-backend
          npx playwright install --with-deps webkit chromium
          npm run test:web
          node tools/verify-web-release.mjs
          VERSION=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('dist/version.json')).version)")
          test "$VERSION" = "${{ steps.version.outputs.version }}"
          (cd dist && zip -qr "../tatsu-home-web-$VERSION.zip" .)

      - uses: actions/setup-java@v5
        if: steps.release_check.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.release_check.outputs.exists != 'true'
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        if: steps.release_check.outputs.exists != 'true'
        with:
          gradle-version: "8.11.1"

      - name: Validate signing secrets
        if: steps.release_check.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Restore release keystore
        if: steps.release_check.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed release
        if: steps.release_check.outputs.exists != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify compressed APK download size
        if: steps.release_check.outputs.exists != 'true'
        run: python tools/check-apk-size.py app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM for renderer verification
        if: steps.release_check.outputs.exists != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify native 3D pixels on the actual AI page
        if: steps.release_check.outputs.exists != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            bash -c 'gradle :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace; mascot_test_status=$?; mkdir -p mascot-evidence; adb exec-out run-as com.tatsu.homehub cat files/mascot-native.png > mascot-evidence/mascot-native.png || true; adb exec-out run-as com.tatsu.homehub cat files/mascot-ai-window.png > mascot-evidence/mascot-ai-window.png || true; adb exec-out run-as com.tatsu.homehub cat files/mascot-motion.png > mascot-evidence/mascot-motion.png || true; adb exec-out run-as com.tatsu.homehub cat files/mascot-home.png > mascot-evidence/mascot-home.png || true; adb exec-out run-as com.tatsu.homehub cat files/mascot-home-window.png > mascot-evidence/mascot-home-window.png || true; for phase in idle speaking tap; do for frame in $(seq 0 11); do adb exec-out run-as com.tatsu.homehub cat files/mascot-$phase-$frame.png > mascot-evidence/mascot-$phase-$frame.png || true; done; done; adb logcat -d > mascot-evidence/logcat.txt || true; if [ "$mascot_test_status" -ne 0 ]; then find app/build/outputs/androidTest-results -name "*.xml" -exec cat {} \; ; tail -n 1200 mascot-evidence/logcat.txt; fi; if [ "$mascot_test_status" -eq 0 ]; then python -c "from pathlib import Path; paths=[Path(\"mascot-evidence/mascot-native.png\"),Path(\"mascot-evidence/mascot-ai-window.png\"),Path(\"mascot-evidence/mascot-motion.png\")]; assert all(p.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for p in paths), \"Missing Android PNG evidence\"" || exit 1; fi; exit "$mascot_test_status"'

      - name: Create animation evidence from Android frames
        if: steps.release_check.outputs.exists != 'true'
        run: |
          python -m pip install Pillow
          python - <<'PYTHON'
          from PIL import Image
          for phase in ('idle', 'speaking', 'tap'):
              frames = []
              for index in range(12):
                  original = Image.open(f'mascot-evidence/mascot-{phase}-{index}.png').convert('RGBA')
                  frame = Image.new('RGBA', original.size, (245, 240, 255, 255))
                  frame.alpha_composite(original)
                  frames.append(frame.convert('RGB'))
              frames[0].save(f'mascot-evidence/mascot-{phase}.gif', save_all=True, append_images=frames[1:], duration=100 if phase == 'tap' else 150, loop=0)
          PYTHON

      - name: Save Android renderer evidence
        if: always() && steps.release_check.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mascot-release-evidence
          path: |
            mascot-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

      - name: Rename APK
        if: steps.release_check.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp app/build/outputs/apk/release/app-release.apk "tatsu-home-$VERSION.apk"

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" "tatsu-home-$VERSION.apk" "mascot-evidence/mascot-native.png" "mascot-evidence/mascot-ai-window.png" "mascot-evidence/mascot-motion.png" "mascot-evidence/mascot-idle.gif" "mascot-evidence/mascot-speaking.gif" "mascot-evidence/mascot-tap.gif" "mascot-evidence/mascot-home.png" "mascot-evidence/mascot-home-window.png" "tatsu-home-web-$VERSION.zip" --title "Tatsu Home v$VERSION" --generate-notes
