name: Release APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version without v prefix; defaults to app versionName
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*System\.getenv\("VERSION_NAME"\)\s*\?:\s*"\K[^"]+' app/build.gradle.kts | head -1)
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No release needed
        if: steps.release_check.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "v$VERSION already exists; skipping"

      - uses: actions/setup-java@v5
        if: steps.release_check.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.release_check.outputs.exists != 'true'
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        if: steps.release_check.outputs.exists != 'true'
        with:
          gradle-version: "8.11.1"

      - name: Validate signing secrets
        if: steps.release_check.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Restore release keystore
        if: steps.release_check.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed release
        if: steps.release_check.outputs.exists != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        if: steps.release_check.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp app/build/outputs/apk/release/app-release.apk "tatsu-home-$VERSION.apk"

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" "tatsu-home-$VERSION.apk" --title "Tatsu Home v$VERSION" --generate-notes
