name: Mascot Android native rendering verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: |
            bash -c 'gradle :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace; mascot_test_status=$?; mkdir -p mascot-evidence; adb exec-out run-as com.tatsu.homehub cat files/mascot-native.png > mascot-evidence/mascot-native.png || true; adb exec-out run-as com.tatsu.homehub cat files/mascot-ai-window.png > mascot-evidence/mascot-ai-window.png || true; adb exec-out run-as com.tatsu.homehub cat files/mascot-motion.png > mascot-evidence/mascot-motion.png || true; adb logcat -d > mascot-evidence/logcat.txt || true; if [ "$mascot_test_status" -ne 0 ]; then find app/build/outputs/androidTest-results -name "*.xml" -exec cat {} \; ; tail -n 1200 mascot-evidence/logcat.txt; fi; if [ "$mascot_test_status" -eq 0 ]; then python -c "from pathlib import Path; paths=[Path(\"mascot-evidence/mascot-native.png\"),Path(\"mascot-evidence/mascot-ai-window.png\"),Path(\"mascot-evidence/mascot-motion.png\")]; assert all(p.read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for p in paths), \"Missing Android PNG evidence\"" || exit 1; fi; exit "$mascot_test_status"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mascot-android-evidence
          path: |
            mascot-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

      - name: Publish verified Android screenshots
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.30 >/dev/null 2>&1; then
            gh release upload v0.4.30 mascot-evidence/mascot-native.png mascot-evidence/mascot-ai-window.png --clobber
          fi
