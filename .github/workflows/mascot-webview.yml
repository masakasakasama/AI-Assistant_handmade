name: Mascot Android WebView verification
on:
  workflow_dispatch:
jobs:
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p mascot-evidence
          adb pull /sdcard/Download/tatsu-mascot.png mascot-evidence/ || true
          adb logcat -d > mascot-evidence/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mascot-android-evidence
          path: |
            mascot-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
