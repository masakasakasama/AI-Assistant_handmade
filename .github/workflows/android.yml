name: Android build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Bundle Android signing tools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" signing-tools/
          cp "$BUILD_TOOLS/zipalign" signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tatsu-home-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/
          retention-days: 14
